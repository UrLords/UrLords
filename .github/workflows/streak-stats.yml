name: Update streak statistics

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/streak-stats.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate streak SVG
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=${{ github.repository_owner }}&hide_border=true&background=00000000&stroke=E4E2E2&ring=A78BFA&fire=FB7185&currStreakNum=E9D5FF&sideNums=E9D5FF&currStreakLabel=E9D5FF&sideLabels=C4B5FD&dates=8B7A9F"
          path: assets/github-streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-streak.svg
          git commit -m "Update GitHub streak statistics" || exit 0
          git push
