<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Erick's build space</title>
  <desc id="desc">A playful purple developer workspace with floating project windows</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171321"/>
      <stop offset="0.52" stop-color="#2E1A47"/>
      <stop offset="1" stop-color="#171321"/>
    </linearGradient>
    <linearGradient id="taro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9D5FF"/>
      <stop offset="0.48" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#A78BFA" stop-opacity=".34"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#E9D5FF" opacity=".09"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#09060E" flood-opacity=".52"/>
    </filter>
  </defs>

  <rect width="1200" height="380" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="26" fill="url(#dots)"/>
  <circle cx="1010" cy="116" r="270" fill="url(#glow)">
    <animate attributeName="r" values="230;285;230" dur="8s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(70 62)">
    <rect width="132" height="31" rx="15.5" fill="#A78BFA" fill-opacity=".14" stroke="#A78BFA" stroke-opacity=".46"/>
    <circle cx="18" cy="15.5" r="5" fill="#5EEAD4">
      <animate attributeName="opacity" values="1;.3;1" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="21" fill="#D8CCED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">BUILD MODE</text>
  </g>

  <text x="70" y="154" fill="#F8F3FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="800">Hey, I'm Erick.</text>
  <text x="70" y="214" fill="url(#taro)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700">I make ideas do something.</text>
  <text x="72" y="258" fill="#B9ACC9" font-family="JetBrains Mono,Consolas,monospace" font-size="16">web products / management systems / visual computing</text>

  <g transform="translate(72 296)">
    <rect width="414" height="42" rx="10" fill="#120E1A" stroke="#4B3C63"/>
    <text x="18" y="27" fill="#5EEAD4" font-family="JetBrains Mono,Consolas,monospace" font-size="14">$ build --learn --ship --repeat</text>
    <rect x="380" y="12" width="9" height="19" rx="2" fill="#FB7185">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.05s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(750 54) rotate(2 170 130)" filter="url(#shadow)">
    <rect width="360" height="246" rx="18" fill="#211A2D" stroke="#6D5A88"/>
    <path d="M0 48H360" stroke="#4B3C63"/>
    <circle cx="24" cy="24" r="5" fill="#FB7185"/>
    <circle cx="43" cy="24" r="5" fill="#FDE68A"/>
    <circle cx="62" cy="24" r="5" fill="#5EEAD4"/>
    <text x="286" y="29" fill="#827294" font-family="JetBrains Mono,Consolas,monospace" font-size="10">ideas.ts</text>
    <text x="24" y="82" fill="#827294" font-family="JetBrains Mono,Consolas,monospace" font-size="13">01</text>
    <text x="54" y="82" fill="#C4B5FD" font-family="JetBrains Mono,Consolas,monospace" font-size="13">const</text>
    <text x="104" y="82" fill="#F8F3FF" font-family="JetBrains Mono,Consolas,monospace" font-size="13">idea</text>
    <text x="142" y="82" fill="#FB7185" font-family="JetBrains Mono,Consolas,monospace" font-size="13">=</text>
    <text x="160" y="82" fill="#5EEAD4" font-family="JetBrains Mono,Consolas,monospace" font-size="13">"what if?"</text>
    <text x="24" y="112" fill="#827294" font-family="JetBrains Mono,Consolas,monospace" font-size="13">02</text>
    <text x="54" y="112" fill="#C4B5FD" font-family="JetBrains Mono,Consolas,monospace" font-size="13">while</text>
    <text x="103" y="112" fill="#F8F3FF" font-family="JetBrains Mono,Consolas,monospace" font-size="13">(!works) &#123;</text>
    <text x="24" y="142" fill="#827294" font-family="JetBrains Mono,Consolas,monospace" font-size="13">03</text>
    <text x="75" y="142" fill="#F8F3FF" font-family="JetBrains Mono,Consolas,monospace" font-size="13">learn();</text>
    <text x="24" y="172" fill="#827294" font-family="JetBrains Mono,Consolas,monospace" font-size="13">04</text>
    <text x="75" y="172" fill="#F8F3FF" font-family="JetBrains Mono,Consolas,monospace" font-size="13">build();</text>
    <text x="24" y="202" fill="#827294" font-family="JetBrains Mono,Consolas,monospace" font-size="13">05</text>
    <text x="54" y="202" fill="#F8F3FF" font-family="JetBrains Mono,Consolas,monospace" font-size="13">&#125;</text>
    <path d="M264 183l16 16 39-46" fill="none" stroke="#5EEAD4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(716 280) rotate(-4 100 35)" filter="url(#shadow)">
    <rect width="226" height="64" rx="14" fill="#4C1D6F" stroke="#A78BFA"/>
    <text x="18" y="27" fill="#E9D5FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">CURRENT QUEST</text>
    <text x="18" y="47" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">make it useful + fun</text>
  </g>

  <g transform="translate(960 300)">
    <circle cx="0" cy="0" r="7" fill="#FB7185"/>
    <circle cx="31" cy="0" r="7" fill="#5EEAD4"/>
    <circle cx="62" cy="0" r="7" fill="#A78BFA"/>
  </g>
</svg>
