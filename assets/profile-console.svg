<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">UrLords profile console</title>
  <desc id="desc">An animated terminal-inspired welcome banner</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080c11" />
      <stop offset="0.55" stop-color="#111820" />
      <stop offset="1" stop-color="#0b1118" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1d69a" />
      <stop offset="0.5" stop-color="#c9a86c" />
      <stop offset="1" stop-color="#f4e2bd" />
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7cc7b8" stop-opacity="0.32" />
      <stop offset="1" stop-color="#7cc7b8" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8fa2b5" stroke-opacity="0.055" />
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45" />
    </filter>
    <clipPath id="windowClip">
      <rect x="26" y="24" width="1148" height="312" rx="18" />
    </clipPath>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)" />
  <rect width="1200" height="360" rx="24" fill="url(#grid)" />
  <circle cx="1040" cy="172" r="240" fill="url(#glow)">
    <animate attributeName="r" values="205;245;205" dur="7s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.55;1;0.55" dur="7s" repeatCount="indefinite" />
  </circle>

  <g filter="url(#shadow)">
    <rect x="26" y="24" width="1148" height="312" rx="18" fill="#0b1117" fill-opacity="0.84" stroke="#263543" />
    <path d="M26 70H1174" stroke="#263543" />
  </g>

  <circle cx="54" cy="47" r="6" fill="#ff6b6b" />
  <circle cx="76" cy="47" r="6" fill="#f2cc60" />
  <circle cx="98" cy="47" r="6" fill="#69db7c" />
  <text x="126" y="53" fill="#738394" font-family="JetBrains Mono, Consolas, monospace" font-size="13">~/profile/hello-world</text>
  <text x="1126" y="53" fill="#52616f" font-family="JetBrains Mono, Consolas, monospace" font-size="12">ONLINE</text>

  <g clip-path="url(#windowClip)">
    <rect x="28" y="71" width="1144" height="2" fill="#c9a86c" opacity="0.34">
      <animate attributeName="y" values="72;332;72" dur="9s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.38;0" dur="9s" repeatCount="indefinite" />
    </rect>
  </g>

  <text x="72" y="118" fill="#7cc7b8" font-family="JetBrains Mono, Consolas, monospace" font-size="18">visitor@github:~$ whoami</text>
  <text x="72" y="188" fill="url(#gold)" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="2">UrLords</text>
  <text x="74" y="228" fill="#aab7c4" font-family="JetBrains Mono, Consolas, monospace" font-size="18">building curious things on the internet</text>
  <text x="74" y="274" fill="#738394" font-family="JetBrains Mono, Consolas, monospace" font-size="15">&gt; ideas --build --learn --repeat</text>
  <rect x="416" y="258" width="10" height="20" rx="2" fill="#c9a86c">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite" />
  </rect>

  <g transform="translate(790 104)">
    <rect width="316" height="172" rx="14" fill="#111a22" stroke="#2c3c49" />
    <text x="22" y="34" fill="#c9a86c" font-family="JetBrains Mono, Consolas, monospace" font-size="13">CURRENT_SESSION</text>
    <circle cx="281" cy="28" r="5" fill="#69db7c">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="22" y="72" fill="#7f91a1" font-family="JetBrains Mono, Consolas, monospace" font-size="12">curiosity</text>
    <rect x="118" y="62" width="166" height="11" rx="5.5" fill="#1d2a34" />
    <rect x="118" y="62" width="144" height="11" rx="5.5" fill="#7cc7b8">
      <animate attributeName="width" values="112;152;144;112" dur="5s" repeatCount="indefinite" />
    </rect>
    <text x="22" y="106" fill="#7f91a1" font-family="JetBrains Mono, Consolas, monospace" font-size="12">ideas</text>
    <rect x="118" y="96" width="166" height="11" rx="5.5" fill="#1d2a34" />
    <rect x="118" y="96" width="128" height="11" rx="5.5" fill="#b98ad9">
      <animate attributeName="width" values="128;146;118;128" dur="6s" repeatCount="indefinite" />
    </rect>
    <text x="22" y="140" fill="#7f91a1" font-family="JetBrains Mono, Consolas, monospace" font-size="12">shipping</text>
    <rect x="118" y="130" width="166" height="11" rx="5.5" fill="#1d2a34" />
    <rect x="118" y="130" width="98" height="11" rx="5.5" fill="#c9a86c">
      <animate attributeName="width" values="82;124;98;82" dur="7s" repeatCount="indefinite" />
    </rect>
  </g>

  <path d="M74 307H1126" stroke="#263543" />
  <text x="74" y="325" fill="#52616f" font-family="JetBrains Mono, Consolas, monospace" font-size="11">STATUS: STILL LEARNING</text>
  <text x="1020" y="325" fill="#52616f" font-family="JetBrains Mono, Consolas, monospace" font-size="11">CTRL + CREATE</text>
</svg>
