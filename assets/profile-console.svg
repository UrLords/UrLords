<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">UrLords profile banner</title>
  <desc id="desc">A taro purple glass-style banner for UrLords, a full-stack and visual-computing builder</desc>
  <defs>
    <linearGradient id="bg" x1="70" y1="18" x2="1200" y2="346" gradientUnits="userSpaceOnUse">
      <stop stop-color="#160F22"/>
      <stop offset="0.52" stop-color="#2E1A47"/>
      <stop offset="1" stop-color="#4C1D6F"/>
    </linearGradient>
    <linearGradient id="panel" x1="96" y1="66" x2="814" y2="294" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".15"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".045"/>
    </linearGradient>
    <linearGradient id="stroke" x1="96" y1="64" x2="1160" y2="304" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E9D5FF" stop-opacity=".48"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity=".13"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".52" stop-color="#E9D5FF"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1048 96) rotate(137) scale(360 250)">
      <stop stop-color="#A78BFA" stop-opacity=".38"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1030 300) rotate(180) scale(500 180)">
      <stop stop-color="#5EEAD4" stop-opacity=".18"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#E9D5FF" opacity=".08"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#08050D" flood-opacity=".46"/>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="28" fill="url(#dots)"/>
  <circle cx="1050" cy="102" r="188" fill="url(#glowA)">
    <animate attributeName="r" values="172;205;172" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1030" cy="300" r="230" fill="url(#glowB)"/>

  <rect x="58" y="48" width="1164" height="264" rx="30" fill="#FFFFFF" fill-opacity=".025" stroke="#FFFFFF" stroke-opacity=".08"/>

  <g filter="url(#shadow)">
    <rect x="88" y="70" width="756" height="220" rx="28" fill="url(#panel)"/>
    <rect x="88.75" y="70.75" width="754.5" height="218.5" rx="27.25" fill="none" stroke="url(#stroke)"/>
  </g>

  <rect x="120" y="100" width="122" height="6" rx="3" fill="#FFFFFF" fill-opacity=".1"/>
  <rect x="120" y="100" width="0" height="6" rx="3" fill="#5EEAD4">
    <animate attributeName="width" values="0;122;122;0" keyTimes="0;.62;.82;1" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#5EEAD4;#A78BFA;#FB7185;#5EEAD4" dur="3.6s" repeatCount="indefinite"/>
  </rect>
  <text x="120" y="166" fill="url(#name)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="800">UrLords</text>
  <text x="120" y="209" fill="#D8CCED" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600">Software Engineer | UI/UX Designer</text>
  <text x="120" y="250" fill="#AA9ABF" font-family="JetBrains Mono,Consolas,monospace" font-size="14">turning "what if?" into something people can actually use</text>

  <g transform="translate(930 76)" filter="url(#shadow)">
    <rect width="214" height="156" rx="24" fill="#FFFFFF" fill-opacity=".07" stroke="url(#stroke)"/>
    <circle cx="32" cy="30" r="5" fill="#FB7185"/>
    <circle cx="50" cy="30" r="5" fill="#FDE68A"/>
    <circle cx="68" cy="30" r="5" fill="#5EEAD4"/>
    <path d="M24 61H190" stroke="#E9D5FF" stroke-opacity=".12"/>
    <text x="24" y="88" fill="#C4B5FD" font-family="JetBrains Mono,Consolas,monospace" font-size="12">const idea = "what if?";</text>
    <text x="24" y="116" fill="#5EEAD4" font-family="JetBrains Mono,Consolas,monospace" font-size="12">build(idea);</text>
    <rect x="24" y="132" width="112" height="6" rx="3" fill="#FFFFFF" fill-opacity=".08"/>
    <rect x="24" y="132" width="84" height="6" rx="3" fill="#A78BFA">
      <animate attributeName="width" values="62;108;84;62" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(884 246) rotate(-3 136 30)" filter="url(#shadow)">
    <rect width="272" height="58" rx="18" fill="#251736" stroke="#6D5290"/>
    <circle cx="28" cy="29" r="7" fill="#5EEAD4">
      <animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="47" y="25" fill="#AA9ABF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700">CURRENT STATUS</text>
    <text x="47" y="42" fill="#F8F3FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">learning, building, shipping</text>
  </g>
</svg>
